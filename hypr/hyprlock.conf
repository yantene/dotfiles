# ═══════════════════════════════════════════════════════════════
#  hyprlock — ags バーと同じサイバーパンクのパレット
#
#  シアン   rgb(00f0ff)   主系統
#  マゼンタ rgb(ff2a6d)   失敗
#  グリーン rgb(7cf6a0)   成功
#  水色     rgb(5fd8e8)   副次情報
#  ミュート rgb(2f5563)
# ═══════════════════════════════════════════════════════════════

background {
  monitor =
  path = screenshot
  blur_passes = 4
  blur_size = 10
  noise = 0.04
  contrast = 1.1
  brightness = 0.35
  vibrancy = 0.2
}

# 時刻
label {
  monitor =
  text = $TIME
  font_size = 120
  font_family = Hack Nerd Font
  color = rgba(00f0ffee)
  shadow_passes = 3
  shadow_size = 8
  shadow_color = rgba(00f0ff66)
  position = 0, 200
  halign = center
  valign = center
}

# 日付
label {
  monitor =
  text = cmd[update:3600000] date +"%Y-%m-%d %a"
  font_size = 26
  font_family = Hack Nerd Font
  color = rgba(5fd8e8cc)
  shadow_passes = 2
  shadow_size = 4
  shadow_color = rgba(00f0ff44)
  position = 0, 100
  halign = center
  valign = center
}

# ホスト名 (HUD の見出しに寄せる)
label {
  monitor =
  text = cmd[update:0] echo "◤ $(hostname | tr a-z A-Z) ◢"
  font_size = 14
  font_family = Hack Nerd Font
  color = rgba(2f5563ff)
  position = 0, 40
  halign = center
  valign = center
}

# ユーザー名
label {
  monitor =
  text = $USER
  font_size = 18
  font_family = Hack Nerd Font
  color = rgba(5fd8e899)
  position = 0, 180
  halign = center
  valign = bottom
}

auth {
  fingerprint {
    enabled = true
    ready_message = ◤ SCAN FINGERPRINT ◢
    present_message = ◤ SCANNING... ◢
  }
}

input-field {
  monitor =
  size = 400, 56
  outline_thickness = 2
  dots_size = 0.28
  dots_spacing = 0.35
  dots_center = true
  outer_color = rgba(00f0ffaa)
  inner_color = rgba(05080ff2)
  font_color = rgba(7de3efee)
  font_family = Hack Nerd Font
  fade_on_empty = false
  placeholder_text = <i>◤ AUTHENTICATE ◢</i>
  hide_input = false
  check_color = rgba(7cf6a0dd)
  fail_color = rgba(ff2a6ddd)
  fail_text = <i>$FAIL</i>
  rounding = 10
  position = 0, 100
  halign = center
  valign = bottom
}
